<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신청내역 관리자</title>
<style>
  :root{
    --deepTeal:#028090; --seafoam:#00A896; --mint:#02C39A;
    --lightMint:#D6F5ED; --paleMint:#EAF7F4; --ink:#10282B;
    --body:#45585B; --muted:#7C8C8E; --white:#FFFFFF; --warn:#C9432B; --warnBg:#FBEAE7;
    --line:#EAEFEE;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.55;}
  .topbar{border-bottom:1px solid var(--line);padding:18px 24px;display:flex;align-items:center;gap:12px;}
  .topbar .brand{font-weight:800;font-size:15px;letter-spacing:.02em;}
  .topbar .x{color:var(--muted);font-weight:400;}
  .topbar .partner{font-weight:800;font-size:15px;color:var(--seafoam);}

  .wrap{max-width:1100px;margin:0 auto;padding:40px 20px 100px;}

  .login-box{max-width:360px;margin:80px auto 0;text-align:center;}
  .login-box h1{font-size:19px;margin:0 0 18px;}
  .login-box input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
    font-size:14px;font-family:inherit;margin-bottom:12px;}
  .btn{border:none;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn.primary{background:var(--seafoam);color:#fff;width:100%;}
  .btn.primary:hover{background:var(--mint);}
  .btn.plain{background:#fff;color:var(--body);border:1px solid var(--line);}
  .btn.plain:hover{background:#F7FAF9;}
  #loginError{color:var(--warn);font-size:12.5px;margin-top:8px;min-height:16px;}

  .dash-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
  .filter-tabs{display:flex;gap:8px;flex-wrap:wrap;}
  .filter-tab{border:1px solid var(--line);background:#fff;color:var(--body);border-radius:999px;
    padding:7px 16px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .filter-tab.active{background:var(--seafoam);border-color:var(--seafoam);color:#fff;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;white-space:nowrap;}
  th{background:#F7FAF9;font-size:12px;color:var(--body);}
  tr:hover td{background:#FAFEFD;}
  .type-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;}
  .type-kit{background:var(--paleMint);color:var(--deepTeal);}
  .type-sign{background:#FFF3D6;color:#8A6100;}
  .type-welcome{background:#E9E4FB;color:#5B3FBF;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:40px 0;}
  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;}
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">MATHOLIC</span>
  <span class="x">×</span>
  <span class="partner">신청내역 관리자</span>
</div>

<div class="wrap">
  <div class="login-box" id="loginView">
    <h1>관리자 비밀번호를 입력해주세요</h1>
    <input type="password" id="pwInput" placeholder="비밀번호">
    <button class="btn primary" id="btnLogin">확인</button>
    <div id="loginError"></div>
  </div>

  <div id="dashView" style="display:none;">
    <div class="dash-head">
      <div class="filter-tabs">
        <button class="filter-tab active" data-type="all">전체</button>
        <button class="filter-tab" data-type="kit">학원맞춤키트</button>
        <button class="filter-tab" data-type="sign">현판</button>
        <button class="filter-tab" data-type="welcome">웰컴키트</button>
      </div>
      <button class="btn plain" id="btnRefresh">새로고침</button>
    </div>
    <div class="table-scroll">
      <table id="dataTable">
        <thead>
          <tr>
            <th>신청일시</th><th>유형</th><th>학원명/문구</th><th>담당자</th>
            <th>연락처</th><th>이메일</th><th>수량</th><th>주소</th><th>파일명</th>
          </tr>
        </thead>
        <tbody id="dataBody"></tbody>
      </table>
    </div>
    <div class="empty" id="emptyMsg" style="display:none;">신청내역이 없습니다.</div>
  </div>
</div>

<script>
// index.html의 Code.gs 배포 웹 앱 URL과 동일하게 맞춰주세요.
const GAS_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbxuEgd8kJZHrxcywRpAweJlSmrEz9zXFJnou2DM88Yj8AvfvF5bLdxlosvpVCVqoRwE/exec';

let allRows = [];
let currentType = 'all';
let currentPassword = '';

const typeLabel = { kit: '학원맞춤키트', sign: '현판', welcome: '웰컴키트' };
const typeClass = { kit: 'type-kit', sign: 'type-sign', welcome: 'type-welcome' };

function fmtDate(v){
  if(!v) return '';
  const d = new Date(v);
  if(isNaN(d.getTime())) return String(v);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderTable(){
  const rows = currentType === 'all' ? allRows : allRows.filter(r => r['유형'] === currentType);
  const body = document.getElementById('dataBody');
  const empty = document.getElementById('emptyMsg');
  if(rows.length === 0){
    body.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  body.innerHTML = rows.map(r => {
    const type = r['유형'] || '';
    const badge = `<span class="type-badge ${typeClass[type]||''}">${typeLabel[type]||type}</span>`;
    return `<tr>
      <td>${fmtDate(r['타임스탬프'])}</td>
      <td>${badge}</td>
      <td>${r['학원명/문구']||''}</td>
      <td>${r['담당자']||''}</td>
      <td>${r['연락처']||''}</td>
      <td>${r['이메일']||''}</td>
      <td>${r['수량']||''}</td>
      <td>${r['주소']||''}</td>
      <td>${r['파일명']||''}</td>
    </tr>`;
  }).join('');
}

async function fetchRows(){
  const url = GAS_WEBHOOK_URL + '?password=' + encodeURIComponent(currentPassword);
  const res = await fetch(url);
  const data = await res.json();
  return data;
}

document.getElementById('btnLogin').onclick = async () => {
  const pw = document.getElementById('pwInput').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if(!pw){ errEl.textContent = '비밀번호를 입력해주세요.'; return; }
  currentPassword = pw;
  try{
    const data = await fetchRows();
    if(data.status === 'ok'){
      allRows = data.rows || [];
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashView').style.display = 'block';
      renderTable();
    } else {
      errEl.textContent = data.message || '비밀번호가 올바르지 않습니다.';
    }
  }catch(err){
    errEl.textContent = '조회 중 오류가 발생했습니다: ' + err.message;
  }
};

document.getElementById('pwInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') document.getElementById('btnLogin').click();
});

document.getElementById('btnRefresh').onclick = async () => {
  try{
    const data = await fetchRows();
    if(data.status === 'ok'){
      allRows = data.rows || [];
      renderTable();
    }
  }catch(err){
    alert('새로고침 중 오류가 발생했습니다: ' + err.message);
  }
};

document.querySelectorAll('.filter-tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentType = tab.dataset.type;
    renderTable();
  };
});
</script>
</body>
</html>
